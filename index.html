            textArea.style.position = 'fixed';
            textArea.style.top = '-9999px';
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
          } catch (err) {}
        };
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);

                          <input type="tel" required maxLength={10} value={buyerPhone} onChange={(e) => setBuyerPhone(e.target.value.replace(/\D/g, ''))} placeholder="10-digit mobile number" className="w-full bg-[#0B0D13] border border-[#262C3F] rounded-r-lg px-3.5 py-2.5 text-white outline-none" />
                        </div>
                      </div>
                      <div>
                        <label className="block font-medium text-slate-300 mb-1">Email ID (For Backup PDF &amp; Receipt)</label>
                        <input type="email" required value={buyerEmail} onChange={(e) => setBuyerEmail(e.target.value)} placeholder="you@example.com" className="w-full bg-[#0B0D13] border border-[#262C3F] rounded-lg px-3.5 py-2.5 text-white outline-none" />
                      </div>
                    </div>

                    <div>
                      <div className="flex gap-2">
                        <input type="text" value={couponInput} onChange={(e) => setCouponInput(e.target.value)} placeholder="Have a creator code? (e.g. REEL50)" className="flex-1 bg-[#0B0D13] border border-[#262C3F] rounded-lg px-3 py-2 text-white font-mono uppercase outline-none" />
                        <button type="button" onClick={() => handleApplyCoupon()} className="bg-white/5 hover:bg-white/10 text-white font-medium px-4 py-2 rounded-lg border border-white/10">
                          Apply
                        </button>
                      </div>
                      {appliedCoupon && <p className="text-[11px] text-emerald-400 mt-1">Discount applied: -₹{appliedCoupon.discount} ({appliedCoupon.code})</p>}
                      {couponError && <p className="text-[11px] text-rose-400 mt-1">{couponError}</p>}
                    </div>

                    <p className="text-[11px] text-slate-400 leading-relaxed bg-[#0B0D13] p-3 rounded-lg border border-[#1F2433]">
                      Your personal PDF copy will be licensed to <span className="text-slate-200 font-medium">{buyerName || 'your name'} {buyerPhone ? `(+91-${buyerPhone})` : ''}</span> and unlocked on this screen immediately after payment.
                    </p>

                    {formError && <div className="bg-rose-500/10 border border-rose-500/30 text-rose-300 p-3 rounded-lg">{formError}</div>}

                    <button type="submit" className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm py-3.5 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                      <span>Pay ₹{checkoutTotals.total} &amp; Download PDF</span>
                      <ArrowRight className="w-4 h-4" />
                    </button>
                  </form>
                )}

                {paymentStep === 'processing' && (
                  <div className="p-10 text-center space-y-3">
                    <RefreshCw className="w-8 h-8 text-indigo-400 animate-spin mx-auto" />
                    <h3 className="text-base font-bold text-white">Confirming UPI Payment...</h3>
                    <p className="text-xs text-slate-400">Preparing your licensed PDF book for {buyerName}</p>
                  </div>
                )}

                {paymentStep === 'success' && (
                  <div className="p-6 space-y-4 text-xs">
                    <div className="bg-emerald-500/10 border border-emerald-500/30 rounded-xl p-4 text-center space-y-1.5">
                      <CheckCircle2 className="w-8 h-8 text-emerald-400 mx-auto" />
                      <h3 className="text-base font-bold text-white">Thank You, {buyerName}!</h3>
                      <p className="text-slate-300">Your copy of <strong>{checkoutBook.title}</strong> is unlocked below.</p>
                    </div>

                    <div className="space-y-2.5">
                      <button
                        onClick={() =>
                          triggerRealPdfPackDownload({
                            ...checkoutBook,
                            stampedBuyerName: buyerName,
                            stampedBuyerPhone: `+91-${buyerPhone}`,
                            stampedBuyerEmail: buyerEmail
                          })
                        }
                        className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm py-3.5 rounded-xl flex items-center justify-center gap-2 transition"
                      >
                        <Download className="w-4 h-4" />
                        <span>Download PDF Book Now</span>
                      </button>

                      <button
                        type="button"
                        onClick={() => {
                          const bookForReader = {
                            ...checkoutBook,
                            stampedBuyerName: buyerName || 'VERIFIED BUYER',
                            stampedBuyerPhone: `+91-${buyerPhone || '9876543210'}`,
                            stampedBuyerEmail: buyerEmail || 'buyer@promptbazar.in'
                          };
                          setCheckoutBook(null);
                          setWebReaderBook(bookForReader);
                        }}
                        className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs py-3 rounded-xl flex items-center justify-center gap-2 transition"
                      >
                        <BookOpen className="w-4 h-4" />
                        <span>Open Online Prompt Reader (1-Tap Copy)</span>
                      </button>

                      <div className="flex gap-2 pt-1">
                        <button
                          type="button"
                          onClick={() =>
                            setStampedPdfPreviewModal({
                              book: checkoutBook,
                              buyerName: buyerName.toUpperCase(),
                              buyerPhone: `+91-${buyerPhone}`,
                              buyerEmail,
                              drmId: `DRM-${Math.floor(10000 + Math.random() * 90000)}`
                            })
                          }
                          className="flex-1 bg-white/5 hover:bg-white/10 text-slate-300 font-medium py-2.5 rounded-xl"
                        >
                          View License Stamp
                        </button>
                        <button
                          type="button"
                          onClick={() =>
                            triggerSplitInvoicePdfDownload(
                              splitTransactions[0] || {
                                id: 'TXN-9901',
                                pdfTitle: checkoutBook.title,
                                creatorHandle: `@${checkoutBook.creatorHandle}`,
                                buyerName,
                                buyerPhone: `+91-${buyerPhone}`,
                                buyerEmail,
                                amount: checkoutTotals.total
                              }
                            )
                          }
                          className="flex-1 bg-white/5 hover:bg-white/10 text-slate-300 font-medium py-2.5 rounded-xl flex items-center justify-center gap-1"
                        >
                          <FileText className="w-3.5 h-3.5" />
                          <span>Tax Receipt</span>
                        </button>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODAL: CREATOR BIO-LINK STOREFRONT */}
          {activeCreatorBioModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-[#12151E] border border-[#262C3F] rounded-3xl max-w-md w-full p-6 space-y-5 shadow-2xl">
                <div className="flex items-center justify-between">
                  <span className="text-[11px] font-mono text-slate-400 bg-[#0B0D13] border border-[#1F2433] px-2.5 py-1 rounded-md">
                    promptbazar.in/@{activeCreatorBioModal.handle}
                  </span>
                  <button onClick={() => setActiveCreatorBioModal(null)} className="p-1.5 rounded-lg bg-white/5 text-slate-400 hover:text-white">
                    <X className="w-4 h-4" />
                  </button>
                </div>

                <div className="text-center space-y-2">
                  <img src={activeCreatorBioModal.avatarUrl} onError={handleImgError} alt={activeCreatorBioModal.name} className="w-16 h-16 rounded-full object-cover border-2 border-indigo-500 mx-auto" />
                  <h3 className="text-lg font-bold text-white flex items-center justify-center gap-1.5">
                    <span>{activeCreatorBioModal.name}</span>
                    <BadgeCheck className="w-4 h-4 text-indigo-400" />
                  </h3>
                  <p className="text-xs text-slate-400">{activeCreatorBioModal.bio}</p>
                </div>

                <div className="space-y-2.5 pt-2 border-t border-[#1F2433]">
                  <div className="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Published Prompt Books</div>
                  {productsList
                    .filter((p) => p.creatorHandle === activeCreatorBioModal.handle || p.id === 'mega-bundle-pdf')
                    .map((book) => (
                      <div key={book.id} className="bg-[#0B0D13] border border-[#1F2433] rounded-xl p-3 flex items-center justify-between gap-3">
                        <div className="flex items-center gap-3 min-w-0">
                          <img src={book.coverImage} onError={handleImgError} alt={book.title} className="w-10 h-12 rounded object-cover shrink-0" />
                          <div className="min-w-0">
                            <div className="text-xs font-semibold text-white truncate">{book.title}</div>
                            <div className="text-xs text-emerald-400 font-bold mt-0.5">
                              ₹{book.price} <span className="text-slate-500 line-through font-normal">₹{book.mrp}</span>
                            </div>
                          </div>
                        </div>
                        <button
                          onClick={() => {
                            setActiveCreatorBioModal(null);
                            handleOpenCheckout(book);
                          }}
                          className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3.5 py-2 rounded-lg shrink-0"
                        >
                          Buy
                        </button>
                      </div>
                    ))}
                </div>
              </div>
            </div>
          )}

          {/* MODAL: ONLINE PROMPT READER */}
          {webReaderBook && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-3 sm:p-6 overflow-y-auto">
              <div className="bg-[#12151E] border border-[#262C3F] rounded-2xl max-w-4xl w-full max-h-[90vh] flex flex-col overflow-hidden shadow-2xl">
                <div className="px-6 py-4 bg-[#0B0D13] border-b border-[#1F2433] flex items-center justify-between gap-4">
                  <div>
                    <span className="text-[10px] font-mono uppercase text-emerald-400">
                      Online Prompt Reader • Licensed to {webReaderBook.stampedBuyerName || buyerName || 'Verified Buyer'}
                    </span>
                    <h3 className="font-bold text-white text-sm sm:text-base mt-0.5">{webReaderBook.title}</h3>
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={() => triggerRealPdfPackDownload(webReaderBook)} className="bg-white/5 hover:bg-white/10 text-slate-200 text-xs font-medium px-3 py-1.5 rounded-lg flex items-center gap-1.5">
                      <Download className="w-3.5 h-3.5" />
                      <span>Download .PDF</span>
                    </button>
                    <button onClick={() => setWebReaderBook(null)} className="p-1.5 rounded-lg bg-white/5 text-slate-400 hover:text-white">
                      <X className="w-4 h-4" />
                    </button>
                  </div>
                </div>

                <div className="p-6 overflow-y-auto space-y-4 flex-1">
                  {(webReaderBook.samplePrompts || []).map((p, i) => (
                    <div key={p.sceneTitle} className="bg-[#0B0D13] border border-[#1F2433] rounded-xl p-4 space-y-3">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-bold text-white">0{i + 1}. {p.sceneTitle}</span>
                        <button
                          onClick={() => copyToClipboard(`${p.imagePrompt}\n\n${p.videoMotionPrompt}`, 'Full scene prompt copied!')}
                          className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium px-3 py-1 rounded-lg flex items-center gap-1.5"
                        >
                          <Copy className="w-3 h-3" />
                          <span>Copy Prompt</span>
                        </button>
                      </div>
                      <p className="font-mono text-xs text-slate-300 leading-relaxed">{p.imagePrompt}</p>
                      <p className="font-mono text-xs text-emerald-400 leading-relaxed pt-2 border-t border-white/5">{p.videoMotionPrompt}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* MODAL: STAMPED PAGE PREVIEW */}
          {stampedPdfPreviewModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#12151E] border border-[#262C3F] rounded-2xl max-w-xl w-full overflow-hidden shadow-2xl">
                <div className="px-5 py-3.5 bg-[#0B0D13] border-b border-[#1F2433] flex items-center justify-between">
                  <span className="text-xs font-bold text-white">Buyer License Watermark Preview</span>
                  <button onClick={() => setStampedPdfPreviewModal(null)} className="text-slate-400 hover:text-white">
                    <X className="w-4 h-4" />
                  </button>
                </div>
                <div className="p-5">
                  <div className="bg-white text-slate-900 rounded-lg p-5 space-y-4">
                    <div className="bg-slate-900 text-white px-3 py-2 rounded text-[10px] font-mono flex justify-between">
                      <span>LICENSED TO: {stampedPdfPreviewModal.buyerName} ({stampedPdfPreviewModal.buyerPhone})</span>
                      <span>{stampedPdfPreviewModal.drmId}</span>
                    </div>
                    <h4 className="font-bold text-sm">{stampedPdfPreviewModal.book.title}</h4>
                    <p className="font-mono text-[11px] text-slate-700 bg-slate-100 p-3 rounded">
                      {stampedPdfPreviewModal.book.samplePrompts?.[0]?.imagePrompt}
                    </p>
                    <div className="border-t border-slate-200 pt-2 text-[10px] font-mono text-slate-500 flex justify-between">
                      <span>PromptBazar.in Verified Edition</span>
                      <span>Licensed to {stampedPdfPreviewModal.buyerPhone}</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: TAX INVOICE VIEWER */}
          {invoiceModalTx && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#12151E] border border-[#262C3F] rounded-2xl max-w-lg w-full p-6 space-y-4 text-xs">
                <div className="flex items-center justify-between border-b border-[#1F2433] pb-3">
                  <h3 className="font-bold text-white text-sm">Payment Receipt ({invoiceModalTx.id})</h3>
                  <button onClick={() => setInvoiceModalTx(null)} className="text-slate-400 hover:text-white">
                    <X className="w-4 h-4" />
                  </button>
                </div>
                <div className="bg-[#0B0D13] border border-[#1F2433] rounded-xl p-4 space-y-2">
                  <div className="flex justify-between"><span className="text-slate-400">Book</span><span className="text-white font-medium">{invoiceModalTx.pdfTitle}</span></div>
                  <div className="flex justify-between"><span className="text-slate-400">Customer</span><span className="text-white font-mono">{invoiceModalTx.buyerName} ({invoiceModalTx.buyerPhone})</span></div>
                  <div className="flex justify-between"><span className="text-slate-400">Amount Paid</span><span className="text-white font-bold">₹{invoiceModalTx.amount}</span></div>
                  <div className="border-t border-[#1F2433] pt-2 flex justify-between text-emerald-400">
                    <span>Creator 92% Share ({invoiceModalTx.creatorHandle})</span>
                    <span>₹{invoiceModalTx.creatorPayout92}</span>
                  </div>
                  <div className="flex justify-between text-indigo-400"><span>Platform 5% Fee</span><span>₹{invoiceModalTx.adminCommission5}</span></div>
                  <div className="flex justify-between text-slate-500"><span>Gateway 3% Fee</span><span>₹{invoiceModalTx.pgFee3}</span></div>
                </div>
                <button onClick={() => triggerSplitInvoicePdfDownload(invoiceModalTx)} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-xl">
                  Download Official Receipt (.PDF)
                </button>
              </div>
            </div>
          )}

          {/* MODAL: MY PURCHASED BOOKS */}
          {showPurchasesModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#12151E] border border-[#262C3F] rounded-2xl max-w-lg w-full p-6 space-y-4">
                <div className="flex items-center justify-between border-b border-[#1F2433] pb-3">
                  <h3 className="font-bold text-white text-sm">My Purchased Books</h3>
                  <button onClick={() => setShowPurchasesModal(false)} className="text-slate-400 hover:text-white">
                    <X className="w-4 h-4" />
                  </button>
                </div>
                {purchasedItems.length === 0 ? (
                  <p className="text-xs text-slate-400 text-center py-8">You haven’t purchased any prompt books in this session yet.</p>
                ) : (
                  <div className="space-y-2.5">
                    {purchasedItems.map((item) => (
                      <div key={item.id} className="bg-[#0B0D13] border border-[#1F2433] rounded-xl p-3.5 flex items-center justify-between gap-3">
                        <div className="min-w-0">
                          <div className="text-xs font-bold text-white truncate">{item.title}</div>
                          <div className="text-[11px] text-slate-400">Licensed to {item.stampedBuyerName} ({item.stampedBuyerPhone})</div>
                        </div>
                        <div className="flex gap-1.5 shrink-0">
                          <button
                            onClick={() => {
                              setShowPurchasesModal(false);
                              setWebReaderBook(item);
                            }}
                            className="bg-indigo-600 text-white text-xs font-medium px-3 py-1.5 rounded-lg"
                          >
                            Read
                          </button>
                          <button onClick={() => triggerRealPdfPackDownload(item)} className="bg-white/5 text-slate-200 text-xs font-medium px-3 py-1.5 rounded-lg">
                            .PDF
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODAL: STAFF LOGIN (PIN 2026) */}
          {showAdminLoginModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#12151E] border border-[#262C3F] rounded-2xl max-w-sm w-full p-6 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-white text-sm">Staff Admin Login</h3>
                  <button onClick={() => setShowAdminLoginModal(false)} className="text-slate-400 hover:text-white">
                    <X className="w-4 h-4" />
                  </button>
                </div>
                <p className="text-xs text-slate-400">
                  Enter your owner PIN to view platform commissions and approve pending books. (Default: <code className="text-indigo-400">{adminSecretPin}</code>)
                </p>
                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    if (adminPinInput.trim() === adminSecretPin) {
                      setIsAdminAuthenticated(true);
                      setShowAdminLoginModal(false);
                      setActiveView('admin-panel');
                      showToast('Staff Admin unlocked');
                    } else {
                      setAdminAuthError('Incorrect PIN. Default is ' + adminSecretPin);
                    }
                  }}
                  className="space-y-3"
                >
                  <input type="password" autoFocus required value={adminPinInput} onChange={(e) => setAdminPinInput(e.target.value)} placeholder="Enter PIN" className="w-full bg-[#0B0D13] border border-[#262C3F] rounded-lg px-3.5 py-2.5 text-center font-mono text-white outline-none" />
                  {adminAuthError && <p className="text-xs text-rose-400 text-center">{adminAuthError}</p>}
                  <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs py-2.5 rounded-lg">
                    Unlock Admin
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: LEGAL & COMPLIANCE */}
          {legalModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#12151E] border border-[#262C3F] rounded-2xl max-w-xl w-full p-6 space-y-4">
                <div className="flex items-center justify-between border-b border-[#1F2433] pb-3">
                  <h3 className="font-bold text-white text-sm">
                    {legalModal === 'privacy' && 'Privacy Policy'}
                    {legalModal === 'terms' && 'Terms & Disclaimer'}
                    {legalModal === 'copyright' && 'Copyright & Anti-Piracy Notice'}
                    {legalModal === 'contact' && 'Customer Support & Office'}
                  </h3>
                  <button onClick={() => setLegalModal(null)} className="text-slate-400 hover:text-white">
                    <X className="w-4 h-4" />
                  </button>
                </div>
                <div className="text-xs text-slate-300 space-y-3 leading-relaxed">
                  {legalModal === 'privacy' && (
                    <p>We collect your Name, Email, and 10-digit WhatsApp Mobile Number solely to deliver your digital PDF book and stamp your personal buyer license. All payments are processed through secure RBI-compliant UPI and card gateways.</p>
                  )}
                  {legalModal === 'terms' && (
                    <p>PromptBazar is an independent digital bookstore for AI video creators. Creators receive 92% of net sales, PromptBazar retains a 5% platform fee, and 3% covers payment gateway processing charges.</p>
                  )}
                  {legalModal === 'copyright' && (
                    <p>Every PDF downloaded on PromptBazar is watermarked with the buyer’s Full Name and +91 Mobile Number. Unauthorized sharing on Telegram or WhatsApp groups is strictly prohibited under the Indian Copyright Act, 1957.</p>
                  )}
                  {legalModal === 'contact' && (
                    <div className="space-y-1">
                      <div className="font-semibold text-white">{businessLegalName}</div>
                      <div>{businessAddress}</div>
                      <div>Email: {supportEmail}</div>
                      <div>WhatsApp Support: +{supportWhatsapp}</div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
