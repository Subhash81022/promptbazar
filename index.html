      try {

    function copyText(text, label) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.top = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
      } catch (e) {}
      showToast(label || '📋 Copied to clipboard!');
    }

    function getCheckoutTotals() {
      const book = getBookById(state.checkoutBookId);

      const base = Number(book.price) || 149;
      const bump = state.includeOrderBump ? 49 : 0;
      const coupon = state.appliedCoupon ? Number(state.appliedCoupon.discount) : 0;
      const total = Math.max(49, base + bump - coupon);

      return { base, bump, coupon, total, saved };

        `-----------------------------------------------------------------------------`,

      (book.samplePrompts || []).forEach((sp, idx) => {
        lines.push(` `);
        lines.push(`SCENE #${idx + 1}: ${sp.sceneTitle}`);
        lines.push(`  [IMAGE PROMPT]: ${sp.imagePrompt.slice(0, 90)}`);
        if (sp.imagePrompt.length > 90) lines.push(`  ${sp.imagePrompt.slice(90, 180)}`);

      let streamCommands = `q\n0.85 0.12 0.18 rg\n30 785 535 36 re f\n`;

      let yPos = 762;
      lines.forEach(line => {
        if (yPos > 65) {
          streamCommands += `BT /F1 9 Tf 0.12 0.15 0.22 rg 38 ${yPos} Td (${escapePdfText(line)}) Tj ET\n`;
          yPos -= 15;

      });

      streamCommands += `0.10 0.14 0.22 rg\n30 22 535 28 re f\n`;
      streamCommands += `BT /F1 9 Tf 0.25 0.92 0.65 rg 42 33 Td (${escapePdfText('PAGE 1 STAMP: Buyer: ' + stampName + ' | Mobile: ' + stampPhone + ' | License: ' + stampDrmId)}) Tj ET\nQ\n`;
