          <div className="bg-[#111827] border border-slate-700 rounded-3xl max-w-xl w-full p-6 space-y-4">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3">
              <h3 className="font-extrabold text-white text-sm uppercase">Official Policy & Compliance</h3>
              <button onClick={() => setLegalModal(null)} className="text-slate-400 hover:text-white">
                <X className="w-5 h-5" />
              </button>
            </div>
            <p className="text-xs text-slate-300 leading-relaxed">
              PromptBazar ({businessLegalName}, {businessAddress}) operates an automated 92% Creator / 5% Admin / 3% Gateway split marketplace. Every downloaded PDF is dynamically stamped with the buyer's Name and Mobile Number under Social DRM anti-piracy protection.
            </p>
          </div>
        </div>
      )}
    </div>
  );
}

const root = createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
