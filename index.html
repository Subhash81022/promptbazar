                      <div className="bg-[#111827] border-2 border-violet-500/40 rounded-3xl p-5 shadow-2xl">

                              compMode === 'amateur' ? 'bg-rose-500/20 border-rose-500 text-rose-300' : 'bg-slate-900 border-slate-800 text-slate-400'

                      {formError && <div className="text-rose-400 text-xs">{formError}</div>}

                      <button
                        type="submit"

                    </div>
                  )}

                  {paymentStep === 'success' && (
                    <div className="space-y-4 mt-6">
                      <div className="bg-emerald-500/15 border border-emerald-500/40 rounded-2xl p-4 text-center">
                        <div className="font-black text-white text-base">🎉 Payment Verified & PDF Stamped!</div>
                        <div className="text-xs text-slate-300 mt-1">
                          Stamped for {buyerName.toUpperCase()} (+91-{buyerPhone})
                        </div>
                      </div>
                      <button
                        onClick={() =>
                          triggerRealPdfPackDownload({
                            ...checkoutBook,
                            stampedBuyerName: buyerName,
                            stampedBuyerPhone: `+91-${buyerPhone}`,
                            stampedBuyerEmail: buyerEmail

                        }
                        className="w-full bg-emerald-500 text-slate-950 font-black text-sm py-4 rounded-xl"
                      >
                        📥 Download Stamped .PDF Now
                      </button>
                      <button
                        onClick={() => triggerSplitInvoicePdfDownload(splitTransactions[0])}
                        className="w-full bg-slate-800 text-amber-300 font-bold text-xs py-3 rounded-xl"
                      >
                        🧾 Download Split Tax Invoice (.PDF)
                      </button>
                    </div>
                  )}
                </div>
              </div>

          {/* MY PURCHASES MODAL */}

                  <h3 className="font-extrabold text-white text-base">My Purchased & Stamped PDFs</h3>
                  <button onClick={() => setShowPurchasesModal(false)} className="text-slate-400 hover:text-white">
                    <X className="w-5 h-5" />
                  </button>
                </div>
                {purchasedItems.length === 0 ? (
                  <p className="text-xs text-slate-400 text-center py-6">No purchases yet in this session.</p>
                ) : (
                  <div className="space-y-2.5">
                    {purchasedItems.map((item) => (
                      <div key={item.id} className="bg-slate-900 border border-slate-800 rounded-xl p-3 flex items-center justify-between">
